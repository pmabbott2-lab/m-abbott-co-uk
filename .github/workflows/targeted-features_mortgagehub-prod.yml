# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Mortgagehub-prod

on:
  push:
    branches:
      - targeted-features
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Package node_modules for App Service Oryx startup
        run: |
          tar -czhf node_modules.tar.gz -C node_modules .
          printf '%s\n' 'compressedNodeModulesFile="node_modules.tar.gz"' > oryx-manifest.toml
          echo '--- srvx archive entries ---'
          tar -tvzf node_modules.tar.gz | grep srvx | head -40
          SRVX_BIN="$(tar -tvzf node_modules.tar.gz | grep -E '^(./)?\.bin/srvx$| [[:space:]](\./)?\.bin/srvx$' | head -1)"
          SRVX_PKG="$(tar -tvzf node_modules.tar.gz | grep -E '^(./)?srvx/package\.json$| [[:space:]](\./)?srvx/package\.json$' | head -1)"
          echo "SRVX_BIN=$SRVX_BIN"
          echo "SRVX_PKG=$SRVX_PKG"
          test -n "$SRVX_BIN"
          test -n "$SRVX_PKG"
          echo "$SRVX_BIN" | grep -qE '^-'
          echo "$SRVX_BIN" | grep -qvE '^l'
          echo ARCHIVE_SRVX_FILE_OK=yes

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_49CEF9EBD19441B2AEE645572930050E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6CDE810C6DD942AA83AAB86938AE38AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0BB4606FADAC49DCB1511B23EE738AAB }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Mortgagehub-prod'
          slot-name: 'Production'
          package: .
