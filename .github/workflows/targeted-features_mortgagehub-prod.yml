# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Mortgagehub-prod

on:
  push:
    branches:
      - targeted-features
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        run: |
          npm ci
          npm run build --if-present

      - name: Prepare self-contained deploy package
        run: |
          npm prune --omit=dev
          rm -rf deploy
          mkdir -p deploy
          cp -a dist package.json package-lock.json patches deploy/
          cp -a node_modules deploy/
          # Overwrite any stale Oryx compressed-modules contract so App Service
          # uses the shipped node_modules instead of extracting node_modules.tar.gz.
          printf '%s\n' 'PlatformName="nodejs"' > deploy/oryx-manifest.toml
          rm -f deploy/node_modules.tar.gz
          test -f deploy/node_modules/srvx/bin/srvx.mjs
          test -f deploy/dist/server/server.js
          test -d deploy/dist/client
          echo DEPLOY_PACKAGE_OK=yes

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_49CEF9EBD19441B2AEE645572930050E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6CDE810C6DD942AA83AAB86938AE38AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0BB4606FADAC49DCB1511B23EE738AAB }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Mortgagehub-prod'
          slot-name: 'Production'
          package: deploy
