<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Earnings and business planning · Mortgage Easy admin</title>
  <link rel="icon" href="/admin/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/admin/admin.css?v=8" />
  <script type="module" src="/admin/app.js?v=8"></script>
</head>
<body>
  <header class="adm-header">
    <div class="adm-wrap adm-header-inner">
      <img class="adm-logo no-print" src="/admin/logo-on-dark.svg" width="150" height="36" alt="Mortgage Easy" />
      <img class="adm-logo print-only" src="/admin/logo.svg" width="150" height="36" alt="Mortgage Easy" />
      <div class="adm-title">
        <strong>Earnings and business planning</strong>
        <span>Owner only · confidential</span>
      </div>
      <div class="adm-user" id="user"></div>
    </div>
  </header>

  <div class="adm-status" id="status" role="status" aria-live="polite"></div>

  <main class="adm-wrap adm-main">
    <div class="seg mode-tabs no-print" id="mode-tabs" role="tablist" aria-label="Calculator">
      <button type="button" role="tab" data-mode="adviser" class="is-active" aria-selected="true">Adviser plans</button>
      <button type="button" role="tab" data-mode="introducer" aria-selected="false">Introducer plans</button>
    </div>

    <section class="card adm-toolbar adm-finder no-print" aria-label="Find a plan">
      <label id="filter-supervisor-wrap">Supervisor<select id="filter-supervisor"><option value="">All supervisors</option></select></label>
      <label><span id="filter-who-label">Adviser</span><select id="filter-who"><option value="">All advisers</option></select></label>
      <label>Saved plans <span class="plan-count" id="plan-count"></span><select id="plan-select"><option value="">New plan</option></select></label>
      <span class="spacer"></span>
      <label>Calendar year<select id="cal-year"></select></label>
    </section>

    <section class="card adm-toolbar" aria-label="Plan">
      <label>Plan name<input type="text" id="plan-name" maxlength="80" autocomplete="off" /></label>
      <label><span id="who-label">Adviser</span><input type="text" id="plan-adviser" maxlength="80" autocomplete="off" list="names-who" /></label>
      <label id="supervisor-wrap">Supervisor<input type="text" id="plan-supervisor" maxlength="80" autocomplete="off" list="names-supervisor" /></label>
      <div class="field-pair" role="group" aria-labelledby="start-label">
        <span id="start-label">Plan starts</span>
        <span class="pair"><select id="start-month" aria-label="Start month"></select><select id="start-year" aria-label="Start year"></select></span>
      </div>
      <button type="button" class="btn btn-green" id="btn-save">Save</button>
      <button type="button" class="btn btn-ghost" id="btn-save-new">Save as new</button>
      <button type="button" class="btn btn-danger" id="btn-delete">Delete</button>
      <span class="adm-dirty" id="dirty" hidden>Unsaved changes</span>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="btn-print">Print / PDF</button>
      <button type="button" class="btn btn-ghost" id="btn-csv">Export CSV</button>
      <button type="button" class="btn btn-ghost" id="btn-json">Export JSON</button>
      <label class="btn btn-ghost" for="import-file">Import JSON</label>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </section>

    <div class="adm-layout" id="layout-adviser">
      <aside class="card adm-inputs" aria-label="Adviser inputs">
        <div class="adm-inputs-head">
          <h2>Adviser inputs</h2>
        </div>
        <div class="seg seg-green" id="scenario-tabs" role="tablist" aria-label="Scenario"></div>
        <p class="field-hint scenario-note" id="scenario-note"></p>
        <div id="case-fields"></div>
        <p class="note">Commission and the rates under <strong>Assumptions</strong> are saved with this adviser's plan.</p>
      </aside>

      <section class="adm-results" aria-label="Results">
        <div class="kpis" id="kpis"></div>
        <nav class="adm-nav" id="panel-nav" aria-label="Sections"></nav>
        <div id="panels"></div>
      </section>
    </div>

    <div class="adm-layout" id="layout-introducer" hidden>
      <aside class="card adm-inputs" aria-label="Introducer inputs">
        <div class="adm-inputs-head"><h2>Introducer inputs</h2></div>
        <div id="intro-fields"></div>
        <p class="note">Commission and procuration rates are saved with this introducer's plan.</p>
      </aside>

      <section class="adm-results" aria-label="Introducer results">
        <div class="kpis" id="intro-kpis"></div>
        <nav class="adm-nav" id="intro-nav" aria-label="Introducer sections"></nav>
        <div id="intro-panels"></div>
      </section>
    </div>

    <details class="card adm-summary no-print" id="summary">
      <summary id="summary-title">Plans summary</summary>
      <div id="summary-body"></div>
    </details>
    <datalist id="names-who"></datalist>
    <datalist id="names-supervisor"></datalist>
  </main>
</body>
</html>
